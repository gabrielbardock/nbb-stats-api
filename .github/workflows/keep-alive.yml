name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos
  workflow_dispatch: # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render API
        run: |
          echo "Pinging Render..."
          curl -s -o /dev/null -w "%{http_code}" https://nbb-api.onrender.com/health
